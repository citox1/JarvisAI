<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JARVIS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at center,
                    #102030 0%,
                    #050b12 45%,
                    #020509 100%
                );

            color: #dffaff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;

            min-height: 100vh;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 30px 20px;
        }

        .title {
            font-size: 42px;
            letter-spacing: 12px;

            margin-bottom: 10px;

            text-shadow:
                0 0 10px #00d9ff,
                0 0 30px #008cff;

            color: #dffaff;
        }

        .status {
            font-size: 14px;
            letter-spacing: 3px;

            color: #64dfff;

            margin-bottom: 50px;
        }

        .reactor {
            width: 230px;
            height: 230px;

            border-radius: 50%;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            background:
                radial-gradient(
                    circle,
                    #031b27 0%,
                    #06131d 45%,
                    #02070c 70%
                );

            box-shadow:
                0 0 15px #00cfff,
                0 0 40px #0077ff,
                inset 0 0 30px #00cfff;

            transition: 0.3s;
        }

        .reactor::before {
            content: "";

            position: absolute;

            width: 170px;
            height: 170px;

            border-radius: 50%;

            border: 2px solid #00d9ff;

            box-shadow:
                0 0 15px #00d9ff,
                inset 0 0 15px #00d9ff;

            animation: rotate 8s linear infinite;
        }

        .reactor::after {
            content: "";

            position: absolute;

            width: 110px;
            height: 110px;

            border-radius: 50%;

            border: 1px dashed #58eaff;

            animation: rotateReverse 5s linear infinite;
        }

        .core {
            width: 65px;
            height: 65px;

            border-radius: 50%;

            background: #baf8ff;

            box-shadow:
                0 0 15px #00eaff,
                0 0 40px #00cfff,
                0 0 70px #0077ff;

            z-index: 2;

            transition: 0.3s;
        }

        .reactor.listening {
            transform: scale(1.08);

            box-shadow:
                0 0 25px #00ffff,
                0 0 70px #008cff,
                inset 0 0 50px #00ffff;
        }

        .reactor.listening .core {
            transform: scale(1.25);

            box-shadow:
                0 0 25px #ffffff,
                0 0 60px #00ffff,
                0 0 100px #008cff;
        }

        .message {
            margin-top: 45px;

            width: 100%;

            min-height: 80px;

            text-align: center;

            padding: 15px;

            font-size: 18px;

            line-height: 1.5;

            color: #bcefff;
        }

        .hint {
            margin-top: 20px;

            font-size: 13px;

            color: #60808d;

            text-align: center;
        }

        @keyframes rotate {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        @keyframes rotateReverse {

            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }

        }

    </style>
</head>

<body>

<div class="container">

    <div class="title">
        JARVIS
    </div>

    <div class="status" id="status">
        ONLINE
    </div>

    <div
        class="reactor"
        id="reactor"
        onclick="startListening()"
    >

        <div class="core"></div>

    </div>

    <div
        class="message"
        id="message"
    >
        Tap the core and speak to JARVIS.
    </div>

    <div class="hint">
        English voice assistant
    </div>

</div>


<script>

    const reactor =
        document.getElementById("reactor");

    const status =
        document.getElementById("status");

    const message =
        document.getElementById("message");


    let recognition;


    // Check whether the browser supports
    // speech recognition.

    if (
        "SpeechRecognition" in window
        ||
        "webkitSpeechRecognition" in window
    ) {

        const SpeechRecognition =
            window.SpeechRecognition
            ||
            window.webkitSpeechRecognition;

        recognition =
            new SpeechRecognition();

        recognition.lang = "en-US";

        recognition.continuous = false;

        recognition.interimResults = false;


        recognition.onstart = function() {

            reactor.classList.add(
                "listening"
            );

            status.innerText =
                "LISTENING";

            message.innerText =
                "I'm listening...";

        };


        recognition.onresult = function(event) {

            const text =
                event.results[0][0].transcript;

            console.log(
                "User:",
                text
            );

            message.innerText =
                text;

            status.innerText =
                "THINKING";

            // Gemini connection will be added
            // in the next stage.

            setTimeout(
                function() {

                    status.innerText =
                        "ONLINE";

                    message.innerText =
                        "I heard you say: "
                        + text;

                },
                500
            );

        };


        recognition.onerror = function(event) {

            console.log(
                "Speech error:",
                event.error
            );

            status.innerText =
                "ONLINE";

            message.innerText =
                "I couldn't hear that. Please try again.";

        };


        recognition.onend = function() {

            reactor.classList.remove(
                "listening"
            );

        };

    }
    else {

        status.innerText =
            "VOICE NOT SUPPORTED";

        message.innerText =
            "Your browser does not support voice recognition.";

    }


    function startListening() {

        if (!recognition) {

            return;

        }

        try {

            recognition.start();

        }
        catch (error) {

            console.log(error);

        }

    }

</script>

</body>
</html>
