<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>JARVIS</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    color: #ff8c00;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle at center,
            rgba(255, 110, 0, 0.12) 0%,
            rgba(80, 25, 0, 0.08) 25%,
            #030303 65%,
            #000 100%
        );
}


/* =========================
   MAIN INTERFACE
========================= */

.interface {
    position: relative;
    width: 100vw;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}


/* =========================
   TOP INFORMATION
========================= */

.header {
    position: absolute;
    top: 30px;
    left: 30px;

    z-index: 20;

    letter-spacing: 8px;
}

.logo {
    font-size: 28px;
    font-weight: 300;

    text-shadow:
        0 0 8px #ff7300,
        0 0 20px #ff4500;
}

.online {
    margin-top: 6px;

    font-size: 11px;
    letter-spacing: 5px;

    opacity: 0.8;
}


/* =========================
   STATUS
========================= */

.status {
    position: absolute;

    bottom: 35px;

    width: 100%;

    text-align: center;

    font-size: 11px;
    letter-spacing: 5px;

    color: #ff9a32;

    text-shadow:
        0 0 8px #ff6500,
        0 0 20px #ff3500;

    z-index: 30;
}


/* =========================
   HOLOGRAM
========================= */

.hologram {

    position: relative;

    width: min(88vw, 520px);
    height: min(88vw, 520px);

    display: flex;
    justify-content: center;
    align-items: center;

    cursor: pointer;

    touch-action: manipulation;

    filter:
        drop-shadow(0 0 20px rgba(255, 100, 0, .8))
        drop-shadow(0 0 60px rgba(255, 70, 0, .4));
}


/* =========================
   CENTRAL CORE
========================= */

.core {

    position: absolute;

    width: 65px;
    height: 65px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fff9dc 0%,
            #ffd28a 15%,
            #ff8c00 35%,
            #ff3d00 65%,
            transparent 75%
        );

    box-shadow:
        0 0 8px #fff,
        0 0 20px #ffb000,
        0 0 40px #ff6500,
        0 0 80px #ff3000;

    z-index: 10;

    animation:
        corePulse 1.4s infinite ease-in-out;
}


/* =========================
   INNER RINGS
========================= */

.ring {

    position: absolute;

    border-radius: 50%;

    border-style: solid;

    pointer-events: none;
}


.ring1 {

    width: 130px;
    height: 130px;

    border-width: 2px;

    border-color:
        #ffbd45
        transparent
        #ff5c00
        transparent;

    animation:
        spin 4s linear infinite;
}


.ring2 {

    width: 180px;
    height: 180px;

    border-width: 1px;

    border-color:
        transparent
        #ff7b00
        transparent
        #ffb000;

    animation:
        reverseSpin 6s linear infinite;
}


.ring3 {

    width: 240px;
    height: 240px;

    border-width: 2px;

    border-color:
        #ff6a00
        transparent
        transparent
        #ff9d00;

    animation:
        spin 9s linear infinite;
}


.ring4 {

    width: 300px;
    height: 300px;

    border-width: 1px;

    border-color:
        transparent
        #ff7500
        #ff9d00
        transparent;

    animation:
        reverseSpin 12s linear infinite;
}


.ring5 {

    width: 365px;
    height: 365px;

    border-width: 1px;

    border-color:
        #ff5b00
        transparent
        #ff7c00
        transparent;

    animation:
        spin 17s linear infinite;
}


.ring6 {

    width: 430px;
    height: 430px;

    border-width: 1px;

    border-color:
        transparent
        #ff8c00
        transparent
        #ff5a00;

    animation:
        reverseSpin 22s linear infinite;
}


/* =========================
   DIGITAL SEGMENTS
========================= */

.segments {

    position: absolute;

    width: 390px;
    height: 390px;

    border-radius: 50%;

    border:
        5px dotted rgba(255, 125, 0, .8);

    animation:
        spin 25s linear infinite;
}


/* =========================
   RADIAL LINES
========================= */

.radial {

    position: absolute;

    width: 470px;
    height: 470px;

    border-radius: 50%;

    background:
        repeating-conic-gradient(
            from 0deg,
            rgba(255, 100, 0, .7) 0deg,
            rgba(255, 100, 0, .7) 1deg,
            transparent 1deg,
            transparent 12deg
        );

    mask-image:
        radial-gradient(
            transparent 55%,
            black 56%,
            black 62%,
            transparent 63%
        );

    -webkit-mask-image:
        radial-gradient(
            transparent 55%,
            black 56%,
            black 62%,
            transparent 63%
        );

    animation:
        reverseSpin 18s linear infinite;
}


/* =========================
   OUTER DIGITAL FIELD
========================= */

.field {

    position: absolute;

    width: 500px;
    height: 500px;

    border-radius: 50%;

    background:
        repeating-conic-gradient(
            from 0deg,
            transparent 0deg,
            transparent 7deg,
            rgba(255, 105, 0, .18) 7deg,
            rgba(255, 105, 0, .18) 8deg
        );

    mask-image:
        radial-gradient(
            transparent 65%,
            black 66%,
            black 80%,
            transparent 81%
        );

    -webkit-mask-image:
        radial-gradient(
            transparent 65%,
            black 66%,
            black 80%,
            transparent 81%
        );

    animation:
        spin 35s linear infinite;
}


/* =========================
   HOLOGRAM PARTICLES
========================= */

.particles {

    position: absolute;

    width: 470px;
    height: 470px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 20% 30%,
            #ff7b00 0 1px,
            transparent 2px
        ),
        radial-gradient(
            circle at 70% 20%,
            #ff9d00 0 1px,
            transparent 2px
        ),
        radial-gradient(
            circle at 80% 70%,
            #ff5500 0 1px,
            transparent 2px
        ),
        radial-gradient(
            circle at 30% 80%,
            #ff8c00 0 1px,
            transparent 2px
        ),
        radial-gradient(
            circle at 50% 10%,
            #ffb000 0 1px,
            transparent 2px
        );

    animation:
        particleSpin 14s linear infinite;
}


/* =========================
   CROSSHAIR
========================= */

.crosshair {

    position: absolute;

    width: 470px;
    height: 470px;

    border-radius: 50%;

    pointer-events: none;
}

.crosshair::before,
.crosshair::after {

    content: "";

    position: absolute;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 120, 0, .7),
            transparent
        );
}

.crosshair::before {

    width: 100%;
    height: 1px;

    top: 50%;
    left: 0;
}

.crosshair::after {

    width: 1px;
    height: 100%;

    left: 50%;
    top: 0;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


@keyframes reverseSpin {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}


@keyframes particleSpin {

    from {
        transform: rotate(0deg) scale(1);
    }

    50% {
        transform: rotate(180deg) scale(1.04);
    }

    to {
        transform: rotate(360deg) scale(1);
    }
}


@keyframes corePulse {

    0%,
    100% {

        transform: scale(1);

        opacity: .9;
    }

    50% {

        transform: scale(1.15);

        opacity: 1;
    }
}


/* =========================
   LISTENING STATE
========================= */

.listening .core {

    animation:
        corePulse .5s infinite ease-in-out;

    box-shadow:
        0 0 15px #fff,
        0 0 35px #ffbd00,
        0 0 70px #ff6500,
        0 0 130px #ff3000;
}


.listening .ring1 {
    animation-duration: 1.5s;
}

.listening .ring2 {
    animation-duration: 2s;
}

.listening .ring3 {
    animation-duration: 3s;
}


/* =========================
   TAP EFFECT
========================= */

.tapFlash {

    position: absolute;

    width: 100px;
    height: 100px;

    border-radius: 50%;

    border: 2px solid #ffb000;

    box-shadow:
        0 0 30px #ff7500,
        0 0 60px #ff4500;

    animation: flash .7s ease-out forwards;

    pointer-events: none;

    z-index: 50;
}


@keyframes flash {

    from {

        transform: scale(.5);

        opacity: 1;
    }

    to {

        transform: scale(5);

        opacity: 0;
    }
}


/* =========================
   SMALL SCREEN
========================= */

@media (max-width: 500px) {

    .header {
        top: 22px;
        left: 20px;
    }

    .logo {
        font-size: 22px;
        letter-spacing: 6px;
    }

    .hologram {
        width: 96vw;
        height: 96vw;
    }

    .ring6 {
        width: 88vw;
        height: 88vw;
    }

    .ring5 {
        width: 75vw;
        height: 75vw;
    }

    .ring4 {
        width: 63vw;
        height: 63vw;
    }

    .ring3 {
        width: 51vw;
        height: 51vw;
    }

    .ring2 {
        width: 38vw;
        height: 38vw;
    }

    .ring1 {
        width: 27vw;
        height: 27vw;
    }

    .segments {
        width: 82vw;
        height: 82vw;
    }

    .radial {
        width: 94vw;
        height: 94vw;
    }

    .field {
        width: 100vw;
        height: 100vw;
    }

    .particles {
        width: 92vw;
        height: 92vw;
    }

    .crosshair {
        width: 92vw;
        height: 92vw;
    }

    .core {
        width: 55px;
        height: 55px;
    }
}

</style>
</head>


<body>

<div class="interface">


    <!-- =====================
         HEADER
    ====================== -->

    <div class="header">

        <div class="logo">
            JARVIS
        </div>

        <div class="online">
            ONLINE
        </div>

    </div>


    <!-- =====================
         HOLOGRAM
    ====================== -->

    <div
        class="hologram"
        id="hologram"
        onclick="activateJarvis()"
    >

        <div class="field"></div>

        <div class="radial"></div>

        <div class="ring ring6"></div>

        <div class="ring ring5"></div>

        <div class="ring ring4"></div>

        <div class="ring ring3"></div>

        <div class="ring ring2"></div>

        <div class="ring ring1"></div>

        <div class="segments"></div>

        <div class="particles"></div>

        <div class="crosshair"></div>

        <div class="core"></div>

    </div>


    <!-- =====================
         STATUS
    ====================== -->

    <div
        class="status"
        id="status"
    >
        TAP THE HOLOGRAM
    </div>


</div>


<script>

/*
=================================================
JARVIS ACTIVATION
=================================================
*/

function activateJarvis() {

    const hologram =
        document.getElementById("hologram");

    const status =
        document.getElementById("status");


    /*
    Create orange flash
    */

    const flash =
        document.createElement("div");

    flash.className =
        "tapFlash";

    hologram.appendChild(flash);


    /*
    Activate listening visual state
    */

    hologram.classList.add("listening");

    status.innerText =
        "INITIALIZING JARVIS";


    /*
    iPhone vibration
    */

    if (
        navigator.vibrate
    ) {

        navigator.vibrate(100);

    }


    /*
    Open the iPhone Shortcut
    */

    window.location.href =
        "shortcuts://run-shortcut?name=Jarvis";


    /*
    Return visual state
    */

    setTimeout(function() {

        hologram.classList.remove(
            "listening"
        );

        status.innerText =
            "JARVIS ONLINE";

    }, 3000);

}


/*
=================================================
PREVENT LONG-PRESS MENU
=================================================
*/

document.addEventListener(
    "contextmenu",
    function(event) {

        event.preventDefault();

    }
);

</script>

</body>
</html>
