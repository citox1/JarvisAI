<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>JARVIS</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    .ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 45px;
    }

    .title {
        color: #ff9b32;
        font-size: 28px;
        letter-spacing: 9px;
        text-shadow:
            0 0 8px #ff7b00,
            0 0 20px #ff5500,
            0 0 45px #ff3300;
    }

    .status {
        margin-top: 10px;
        color: #ff9b32;
        font-size: 11px;
        letter-spacing: 5px;
        opacity: .8;
    }

    .hint {
        position: absolute;
        bottom: 35px;
        color: #ff8c32;
        font-size: 10px;
        letter-spacing: 3px;
        opacity: .55;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="ui">
    <div class="title">JARVIS</div>
    <div class="status">SYSTEM ONLINE</div>
    <div class="hint">HOLOGRAPHIC AI CORE</div>
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H, CX, CY;
let particles = [];
let rings = [];

function resize() {

    W = canvas.width = window.innerWidth * devicePixelRatio;
    H = canvas.height = window.innerHeight * devicePixelRatio;

    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(
        devicePixelRatio, 0, 0,
        devicePixelRatio, 0, 0
    );

    CX = window.innerWidth / 2;
    CY = window.innerHeight / 2;

    createParticles();
    createRings();
}

window.addEventListener("resize", resize);


/* -------------------------
   PARTICLES
------------------------- */

function createParticles() {

    particles = [];

    const amount = 1700;

    for (let i = 0; i < amount; i++) {

        const u = Math.random();
        const v = Math.random();

        const theta =
            Math.acos(2 * u - 1);

        const phi =
            Math.PI * 2 * v;

        const radius =
            0.72 + Math.random() * 0.28;

        particles.push({
            theta: theta,
            phi: phi,
            radius: radius,
            size: Math.random() * 1.7 + .2,
            alpha: Math.random() * .75 + .15,
            speed: Math.random() * .008 + .002
        });
    }
}


/* -------------------------
   ROTATING RINGS
------------------------- */

function createRings() {

    rings = [];

    for (let i = 0; i < 18; i++) {

        rings.push({
            angle:
                Math.random() * Math.PI * 2,

            tilt:
                Math.random() * Math.PI,

            radius:
                120 + Math.random() * 130,

            width:
                Math.random() * 1.5 + .4,

            speed:
                (Math.random() - .5) * .008,

            alpha:
                Math.random() * .35 + .1
        });
    }
}


/* -------------------------
   DRAW
------------------------- */

let rotation = 0;

function draw() {

    const width = window.innerWidth;
    const height = window.innerHeight;

    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.fillRect(0, 0, width, height);


    /*
       Orange holographic glow
    */

    const glow =
        ctx.createRadialGradient(
            CX, CY, 20,
            CX, CY, 300
        );

    glow.addColorStop(0,
        "rgba(255,150,40,.22)");

    glow.addColorStop(.35,
        "rgba(255,80,10,.10)");

    glow.addColorStop(1,
        "rgba(0,0,0,0)");

    ctx.fillStyle = glow;

    ctx.beginPath();
    ctx.arc(CX, CY, 330, 0, Math.PI * 2);
    ctx.fill();


    /*
       Sphere particles
    */

    rotation += 0.004;

    const radius =
        Math.min(width, height) * .31;

    for (const p of particles) {

        p.phi += p.speed;

        const x3 =
            p.radius *
            Math.sin(p.theta) *
            Math.cos(p.phi + rotation);

        const y3 =
            p.radius *
            Math.cos(p.theta);

        const z3 =
            p.radius *
            Math.sin(p.theta) *
            Math.sin(p.phi + rotation);


        /*
           Perspective
        */

        const perspective =
            1 / (1.7 - z3);

        const x =
            CX + x3 * radius * perspective;

        const y =
            CY + y3 * radius * perspective;


        const size =
            p.size * perspective;


        /*
           Depth brightness
        */

        const brightness =
            .35 + (z3 + 1) * .32;

        ctx.fillStyle =
            `rgba(255,${110 + z3 * 45},35,${p.alpha * brightness})`;

        ctx.shadowBlur = 10;
        ctx.shadowColor = "#ff5a00";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            Math.max(.3, size),
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.shadowBlur = 0;


    /*
       Holographic rotating rings
    */

    for (const r of rings) {

        r.angle += r.speed;

        ctx.save();

        ctx.translate(CX, CY);

        ctx.rotate(r.angle);

        ctx.scale(
            1,
            .22 + Math.abs(Math.sin(r.tilt)) * .45
        );

        ctx.strokeStyle =
            `rgba(255,${100 + Math.random() * 80},40,${r.alpha})`;

        ctx.lineWidth = r.width;

        ctx.shadowBlur = 12;
        ctx.shadowColor = "#ff5a00";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            r.radius,
            0,
            Math.PI * 2
        );

        ctx.stroke();

        ctx.restore();
    }

    ctx.shadowBlur = 0;


    /*
       Random holographic scanning lines
    */

    for (let i = 0; i < 14; i++) {

        const y =
            CY - radius +
            Math.random() * radius * 2;

        const lineWidth =
            Math.random() * 160 + 40;

        ctx.strokeStyle =
            "rgba(255,120,40,.16)";

        ctx.lineWidth = .7;

        ctx.beginPath();

        ctx.moveTo(
            CX - lineWidth,
            y
        );

        ctx.lineTo(
            CX + lineWidth,
            y
        );

        ctx.stroke();
    }


    /*
       Core
    */

    const core =
        ctx.createRadialGradient(
            CX, CY, 0,
            CX, CY, 70
        );

    core.addColorStop(
        0,
        "rgba(255,245,210,.95)"
    );

    core.addColorStop(
        .15,
        "rgba(255,170,70,.65)"
    );

    core.addColorStop(
        .45,
        "rgba(255,70,10,.20)"
    );

    core.addColorStop(
        1,
        "rgba(255,30,0,0)"
    );

    ctx.fillStyle = core;

    ctx.beginPath();

    ctx.arc(
        CX,
        CY,
        70,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Central holographic point
    */

    ctx.fillStyle =
        "rgba(255,235,190,.95)";

    ctx.shadowBlur = 25;
    ctx.shadowColor = "#ff7000";

    ctx.beginPath();

    ctx.arc(
        CX,
        CY,
        4,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.shadowBlur = 0;


    requestAnimationFrame(draw);
}


resize();
draw();

</script>

</body>
</html>
